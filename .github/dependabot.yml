# Version updates in batches: one PR per month and ecosystem. Security alerts
# arrive immediately regardless. A new version is only offered after seven
# days, so withdrawn or compromised releases do not come in.
#
# Groups only bundle minor and patch updates; a major update arrives as its
# own PR so it can be checked on its own.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      rust:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Follows the Node runtime (deploy/dev/web.Dockerfile,
      # scripts/ci/tools.Dockerfile) and is bumped together with it.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
