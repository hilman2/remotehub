[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The version applies to the whole release (images, ops package, tag vX.Y.Z).
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/hilman2/remotehub"

[workspace.dependencies]
remotehub-directory = { path = "crates/directory" }

anyhow = "1.0.104"
axum = "0.8.9"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
secrecy = "0.10.3"
uuid = { version = "1.26.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "fs"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
http-body-util = "0.1.5"
tempfile = "3.27.0"

[workspace.lints.rust]
# deny rather than forbid: a justified exception stays possible with
# #[allow(unsafe_code)] at exactly that spot.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# Smaller object files and faster builds; backtraces keep line numbers.
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = "debuginfo"
