[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The version applies to the whole release (images, ops package, tag vX.Y.Z).
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/hilman2/remotehub"

[workspace.dependencies]
remotehub-browser = { path = "crates/browser" }
remotehub-directory = { path = "crates/directory" }
remotehub-gateway = { path = "crates/gateway" }
remotehub-i18n = { path = "crates/i18n" }
remotehub-model = { path = "crates/model" }
remotehub-vault = { path = "crates/vault" }

anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
data-encoding = "2.11.1"
clap = { version = "4.6.7", features = ["derive"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
getrandom = "0.4.3"
# Already in the tree through russh: ECDH for the organisation recovery key.
p256 = { version = "0.14.0", default-features = false, features = ["ecdh"] }
hkdf = "0.13.0"
hmac = "0.13.0"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
# Mail (#145): SMTP with rustls, like everything else here.
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls", "ring", "rustls-native-certs"] }
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa", "flate2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
# Already in the tree through ldap3: the system's CAs for the site connector.
rustls-native-certs = "0.8.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
secrecy = { version = "0.10.3", features = ["serde"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
unic-langid = { version = "0.9.6", features = ["macros"] }
uuid = { version = "1.26.1", features = ["serde"] }
zeroize = { version = "1.9.0", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "time", "sync", "fs"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
http-body-util = "0.1.5"
# Already in the tree through axum: the client that forwards to Ory Kratos.
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
# Already in the tree through ldap3; reads the public key of a certificate.
x509-parser = "0.18.1"
futures-util = "0.3.31"

[workspace.lints.rust]
# deny rather than forbid: a justified exception stays possible with
# #[allow(unsafe_code)] at exactly that spot.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# Smaller object files and faster builds; backtraces keep line numbers.
debug = "line-tables-only"

# Password hashing is deliberately slow; unoptimised it takes seconds per test.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
strip = "debuginfo"
