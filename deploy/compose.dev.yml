# Development environment — everything runs in Docker:
#   docker compose -f deploy/compose.dev.yml up --build
#   UI: http://localhost:5180 · Database: 127.0.0.1:55440 (user, password and database: remotehub)
#
# Other projects on the development machine already publish 5173, 8025,
# 55432 and 55433; remotehub only publishes 55440 (database) and 5180 (UI).
#
# The source is mounted from the repository (/work); builds go to named
# volumes (target/, cargo registry) because bind mounts are slow on Windows.
# The server is rebuilt and restarted on changes (watchexec with --poll, see
# deploy/dev/rust.Dockerfile).
name: remotehub-dev

x-rust: &rust
  build:
    context: dev
    dockerfile: rust.Dockerfile
  image: remotehub-dev-rust
  init: true
  volumes:
    - ..:/work
    - target:/target
    - cargo-registry:/usr/local/cargo/registry
    - cargo-git:/usr/local/cargo/git
  environment: &rust-env
    TZ: Europe/Berlin
    RUST_LOG: info,remotehub_server=debug,tower_http=debug
    REMOTEHUB_DATABASE_URL: postgres://remotehub:remotehub@db:5432/remotehub
    # For #[sqlx::test]: creates a fresh database per test on this server.
    DATABASE_URL: postgres://remotehub:remotehub@db:5432/remotehub
    # Test lab for the integration tests (tests/integration_*.rs).
    REMOTEHUB_TEST_LDAP_URL: ldaps://dc.remotehub.test
    REMOTEHUB_TEST_SSH_HOST: ssh-target
    REMOTEHUB_TEST_GUACD: guacd:4822
    REMOTEHUB_TEST_DESKTOP_HOST: desktop-target
    REMOTEHUB_TEST_BROWSER: browser:4823
    REMOTEHUB_TEST_WEB_HOST: web-target

services:
  db:
    image: postgres:18.6-trixie
    environment:
      TZ: Europe/Berlin
      POSTGRES_DB: remotehub
      POSTGRES_USER: remotehub
      POSTGRES_PASSWORD: remotehub
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      # Since PostgreSQL 18, PGDATA lives in a versioned directory below /var/lib/postgresql.
      - db:/var/lib/postgresql
    healthcheck:
      # TCP, not the socket: during initdb the entrypoint runs a socket-only
      # temporary server that would report ready too early.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "remotehub", "-d", "remotehub"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    # API on http://server:8080 inside the compose network; the UI reaches it through Vite.
    # Signs in against the test lab domain: e.g. alice / Alice-Passw0rd! (deploy/testlab/dc/users.sh).
    <<: *rust
    environment:
      <<: *rust-env
      REMOTEHUB_PUBLIC_URL: http://localhost:5180
      # Development key, public on purpose (see the file).
      REMOTEHUB_MASTER_KEY_FILE: /work/deploy/dev/master.key
      # The lab's CA key, which the SSH target trusts (deploy/testlab/ssh).
      REMOTEHUB_SSH_CA_KEY_FILE: /work/deploy/testlab/ssh/remotehub_ca
      REMOTEHUB_LDAP_URL: ldaps://dc.remotehub.test
      REMOTEHUB_LDAP_CA_FILE: /work/deploy/testlab/dc/tls/ca.crt
      REMOTEHUB_LDAP_BIND_DN: svc-remotehub@remotehub.test
      REMOTEHUB_LDAP_BIND_PASSWORD: Svc-Passw0rd!
      REMOTEHUB_LDAP_BASE_DN: DC=remotehub,DC=test
      REMOTEHUB_ADMIN_GROUPS: RH Admins
      REMOTEHUB_RDP_KEYBOARD_LAYOUT: de-de-qwertz
      REMOTEHUB_BROWSER: browser:4823
      # Local accounts (#103); the first one is invited with
      #   docker compose -f deploy/compose.dev.yml exec server cargo run -q -p remotehub-server -- account invite you@example.com
      REMOTEHUB_KRATOS_URL: http://kratos:4433
      REMOTEHUB_KRATOS_ADMIN_URL: http://kratos:4434
      REMOTEHUB_ADMIN_ACCOUNTS: admin@remotehub.test
    command: >
      watchexec --poll 1000ms --restart --watch crates --watch migrations --watch Cargo.toml
      --exts rs,toml,sql,ftl -- cargo run --package remotehub-server
    depends_on:
      db:
        condition: service_healthy
      dc:
        condition: service_healthy

  # Ory Kratos for local accounts (#103, deploy/ops/kratos): its own database on
  # the same server. The browser reaches it only through the server
  # (/api/auth/); --dev lets its cookies work over http://localhost.
  kratos-db:
    image: postgres:18.6-trixie
    environment:
      PGPASSWORD: remotehub
    command: sh -c 'createdb -h db -U remotehub kratos 2>/dev/null || true'
    depends_on:
      db:
        condition: service_healthy

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    environment: &kratos-env
      DSN: postgres://remotehub:remotehub@db:5432/kratos?sslmode=disable
      SERVE_PUBLIC_BASE_URL: http://localhost:5180/api/auth/
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: http://localhost:5180/
      SELFSERVICE_ALLOWED_RETURN_URLS: '["http://localhost:5180/"]'
      SELFSERVICE_FLOWS_ERROR_UI_URL: http://localhost:5180/sign-in
      SELFSERVICE_FLOWS_LOGIN_UI_URL: http://localhost:5180/sign-in
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: http://localhost:5180/sign-in
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: http://localhost:5180/account
      SELFSERVICE_FLOWS_RECOVERY_UI_URL: http://localhost:5180/sign-in/recovery
      SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: http://localhost:5180/sign-in
      # Development secrets, public on purpose.
      SECRETS_COOKIE: '["dev-cookie-secret-not-for-production"]'
      SECRETS_CIPHER: '["dev-cipher-secret-32-characters!"]'
      SECRETS_DEFAULT: '["dev-default-secret-not-for-production"]'
      # The lab's OpenID Connect provider (deploy/testlab/oidc, #109).
      SELFSERVICE_METHODS_OIDC_ENABLED: "true"
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS: >-
        [{"id": "lab", "label": "Lab", "provider": "generic",
        "issuer_url": "http://oidc:5556/dex", "client_id": "remotehub",
        "client_secret": "lab-oidc-secret", "scope": ["openid", "email", "profile"],
        "mapper_url": "file:///etc/config/kratos/oidc.jsonnet"}]
      # No courier in development: invitations hand out their code.
      LOG_FORMAT: text
      # No usage reports to Ory.
      SQA_OPT_OUT: "true"
    volumes:
      - ./ops/kratos:/etc/config/kratos:ro
    command: -c /etc/config/kratos/kratos.yml migrate sql up -e --yes
    depends_on:
      kratos-db:
        condition: service_completed_successfully

  kratos:
    image: oryd/kratos:v26.2.0
    environment: *kratos-env
    volumes:
      - ./ops/kratos:/etc/config/kratos:ro
    command: serve -c /etc/config/kratos/kratos.yml --dev
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully

  # Workbench for a shell, tests and rust-analyzer (dev container, .devcontainer/):
  #   docker compose -f deploy/compose.dev.yml run --rm workbench cargo nextest run
  workbench:
    <<: *rust
    command: sleep infinity
    profiles: [workbench]
    depends_on:
      db:
        condition: service_healthy
      dc:
        condition: service_healthy
      ssh-target:
        condition: service_started

  # End-to-end tests in a real browser against this stack (web/tests/e2e):
  #   docker compose -f deploy/compose.dev.yml --profile e2e run --rm e2e
  # It shares the network of `web`, so the UI is http://localhost:5180 — Secure
  # cookies need localhost. Keep the image equal to @playwright/test.
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: [e2e]
    network_mode: "service:web"
    working_dir: /work/web
    command: node node_modules/@playwright/test/cli.js test
    environment:
      TZ: Europe/Berlin
      E2E_BASE_URL: http://localhost:5180
      E2E_SSH_HOST: ssh-target
      CI: "1"
    volumes:
      - ..:/work
      - web-node-modules:/work/web/node_modules

  # Test lab (deploy/testlab): a throwaway AD domain, an SSH target, a
  # desktop target (RDP and VNC) and a web target (an appliance's sign-in page)
  # for the integration tests. Only reachable on the compose network; users,
  # passwords and keys are in the READMEs and scripts there.
  dc:
    build: testlab/dc
    image: remotehub-testlab-dc
    hostname: dc
    networks:
      default:
        aliases: [dc.remotehub.test]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/636"]
      interval: 2s
      timeout: 2s
      retries: 30

  ssh-target:
    build: testlab/ssh
    image: remotehub-testlab-ssh
    hostname: ssh-target

  desktop-target:
    build: testlab/desktop
    image: remotehub-testlab-desktop
    hostname: desktop-target

  web-target:
    build: testlab/web
    image: remotehub-testlab-web
    hostname: web-target

  # An OpenID Connect provider for sign-in through Kratos (#109).
  oidc:
    image: ghcr.io/dexidp/dex:v2.43.1
    hostname: oidc
    volumes:
      - ./testlab/oidc/config.yaml:/etc/dex/config.yaml:ro
    command: dex serve /etc/dex/config.yaml

  # Web interfaces of HTTPS devices (deploy/browser, ADR 0007), hardened as in
  # production. Like guacd, it serves anyone who reaches it: never published.
  browser:
    build:
      context: ..
      dockerfile: deploy/browser/Dockerfile
    image: remotehub-browser
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    # Chromium's sandbox needs user namespaces, which Docker's default
    # seccomp profile forbids.
    security_opt: [no-new-privileges:true, seccomp:unconfined]
    mem_limit: 2g
    pids_limit: 1024

  # RDP and VNC engine (deploy/guacd), hardened as in production. guacd serves
  # anyone who reaches port 4822, so it is never published.
  guacd:
    build: guacd
    image: remotehub-guacd
    read_only: true
    tmpfs:
      - /tmp
      - /home/guacd:uid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 256

  web:
    # SvelteKit with Vite: http://localhost:5180 (API and WebSocket go to the server)
    build:
      context: dev
      dockerfile: web.Dockerfile
    image: remotehub-dev-web
    init: true
    command: sh -c 'pnpm install --frozen-lockfile && pnpm dev'
    environment:
      TZ: Europe/Berlin
      VITE_POLLING: "1"
      REMOTEHUB_SERVER: http://server:8080
      # Store inside the node_modules volume so pnpm can hard-link.
      pnpm_config_store_dir: /work/web/node_modules/.pnpm-store
    volumes:
      - ..:/work
      - web-node-modules:/work/web/node_modules
    ports:
      - "127.0.0.1:5180:5180"

volumes:
  db:
  target:
  cargo-registry:
  cargo-git:
  web-node-modules:
