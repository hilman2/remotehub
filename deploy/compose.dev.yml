# Development environment — everything runs in Docker:
#   docker compose -f deploy/compose.dev.yml up --build
#   UI: http://localhost:5180 · Database: 127.0.0.1:55440 (user, password and database: remotehub)
#
# Other projects on the development machine already publish 5173, 8025,
# 55432 and 55433; remotehub only publishes 55440 (database) and 5180 (UI).
#
# The source is mounted from the repository (/work); builds go to named
# volumes (target/, cargo registry) because bind mounts are slow on Windows.
# The server is rebuilt and restarted on changes (watchexec with --poll, see
# deploy/dev/rust.Dockerfile).
name: remotehub-dev

x-rust: &rust
  build:
    context: dev
    dockerfile: rust.Dockerfile
  image: remotehub-dev-rust
  init: true
  volumes:
    - ..:/work
    - target:/target
    - cargo-registry:/usr/local/cargo/registry
    - cargo-git:/usr/local/cargo/git
  environment:
    TZ: Europe/Berlin
    RUST_LOG: info,remotehub_server=debug,tower_http=debug
    REMOTEHUB_DATABASE_URL: postgres://remotehub:remotehub@db:5432/remotehub
    # For #[sqlx::test]: creates a fresh database per test on this server.
    DATABASE_URL: postgres://remotehub:remotehub@db:5432/remotehub
    # Test lab for the integration tests (tests/integration_*.rs).
    REMOTEHUB_TEST_LDAP_URL: ldaps://dc.remotehub.test
    REMOTEHUB_TEST_SSH_HOST: ssh-target

services:
  db:
    image: postgres:18.6-trixie
    environment:
      TZ: Europe/Berlin
      POSTGRES_DB: remotehub
      POSTGRES_USER: remotehub
      POSTGRES_PASSWORD: remotehub
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      # Since PostgreSQL 18, PGDATA lives in a versioned directory below /var/lib/postgresql.
      - db:/var/lib/postgresql
    healthcheck:
      # TCP, not the socket: during initdb the entrypoint runs a socket-only
      # temporary server that would report ready too early.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "remotehub", "-d", "remotehub"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    # API on http://server:8080 inside the compose network; the UI reaches it through Vite.
    <<: *rust
    command: >
      watchexec --poll 1000ms --restart --watch crates --watch migrations --watch Cargo.toml
      --exts rs,toml,sql,ftl -- cargo run --package remotehub-server
    depends_on:
      db:
        condition: service_healthy

  # Workbench for a shell, tests and rust-analyzer (dev container, .devcontainer/):
  #   docker compose -f deploy/compose.dev.yml run --rm workbench cargo nextest run
  workbench:
    <<: *rust
    command: sleep infinity
    profiles: [workbench]
    depends_on:
      db:
        condition: service_healthy
      dc:
        condition: service_healthy
      ssh-target:
        condition: service_started

  # Test lab (deploy/testlab): a throwaway AD domain and an SSH target for the
  # integration tests. Only reachable on the compose network; users,
  # passwords and keys are in the READMEs and scripts there.
  dc:
    build: testlab/dc
    image: remotehub-testlab-dc
    hostname: dc
    networks:
      default:
        aliases: [dc.remotehub.test]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/636"]
      interval: 2s
      timeout: 2s
      retries: 30

  ssh-target:
    build: testlab/ssh
    image: remotehub-testlab-ssh
    hostname: ssh-target

  web:
    # SvelteKit with Vite: http://localhost:5180 (API and WebSocket go to the server)
    build:
      context: dev
      dockerfile: web.Dockerfile
    image: remotehub-dev-web
    init: true
    command: sh -c 'pnpm install --frozen-lockfile && pnpm dev'
    environment:
      TZ: Europe/Berlin
      VITE_POLLING: "1"
      REMOTEHUB_SERVER: http://server:8080
      # Store inside the node_modules volume so pnpm can hard-link.
      pnpm_config_store_dir: /work/web/node_modules/.pnpm-store
    volumes:
      - ..:/work
      - web-node-modules:/work/web/node_modules
    ports:
      - "127.0.0.1:5180:5180"

volumes:
  db:
  target:
  cargo-registry:
  cargo-git:
  web-node-modules:
