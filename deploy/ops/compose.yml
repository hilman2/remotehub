# remotehub in production: the server, PostgreSQL, guacd and the browser
# service.
# Installation, configuration and upgrades: docs/install.md.
#
#   sh init.sh            # once: creates .env and the secrets in secrets/
#   docker compose up -d
#
# remotehub listens on 127.0.0.1 only; a reverse proxy on the host serves it
# with TLS under REMOTEHUB_PUBLIC_URL (docs/install.md#reverse-proxy).
name: remotehub

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  remotehub:
    <<: *hardened
    image: ${REMOTEHUB_IMAGE:-ghcr.io/hilman2/remotehub}:${REMOTEHUB_VERSION:?set REMOTEHUB_VERSION in .env}
    environment:
      REMOTEHUB_PUBLIC_URL: ${REMOTEHUB_PUBLIC_URL:?set REMOTEHUB_PUBLIC_URL in .env}
      REMOTEHUB_DATABASE_URL: postgres://remotehub@db:5432/remotehub
      REMOTEHUB_DATABASE_PASSWORD_FILE: /run/secrets/db_password
      REMOTEHUB_MASTER_KEY_FILE: /run/secrets/master_key
      REMOTEHUB_SSH_CA_KEY_FILE: /run/secrets/ssh_ca_key
      REMOTEHUB_GUACD: guacd:4822
      REMOTEHUB_BROWSER: browser:4823
      REMOTEHUB_LOG_FORMAT: ${REMOTEHUB_LOG_FORMAT:-text}
      REMOTEHUB_LDAP_URL: ${REMOTEHUB_LDAP_URL:-}
      REMOTEHUB_LDAP_STARTTLS: ${REMOTEHUB_LDAP_STARTTLS:-false}
      REMOTEHUB_LDAP_BIND_DN: ${REMOTEHUB_LDAP_BIND_DN:-}
      REMOTEHUB_LDAP_BIND_PASSWORD_FILE: /run/secrets/ldap_bind_password
      REMOTEHUB_LDAP_BASE_DN: ${REMOTEHUB_LDAP_BASE_DN:-}
      REMOTEHUB_LDAP_USER_FILTER: ${REMOTEHUB_LDAP_USER_FILTER:-}
      # The CA of the directory's certificate, if it is not a public one:
      # put it at certs/ldap-ca.crt and set this to /run/certs/ldap-ca.crt.
      REMOTEHUB_LDAP_CA_FILE: ${REMOTEHUB_LDAP_CA_FILE:-}
      REMOTEHUB_OWN_ACCOUNT_CONNECTIONS: ${REMOTEHUB_OWN_ACCOUNT_CONNECTIONS:-true}
      # Local accounts (ADR 0010): Kratos below.
      REMOTEHUB_KRATOS_URL: http://kratos:4433
      REMOTEHUB_KRATOS_ADMIN_URL: http://kratos:4434
      REMOTEHUB_RDP_KEYBOARD_LAYOUT: ${REMOTEHUB_RDP_KEYBOARD_LAYOUT:-en-us-qwerty}
      REMOTEHUB_SESSION_IDLE_MINUTES: ${REMOTEHUB_SESSION_IDLE_MINUTES:-30}
      REMOTEHUB_SESSION_MAX_HOURS: ${REMOTEHUB_SESSION_MAX_HOURS:-12}
      # The reverse proxy on this host reaches remotehub through the gateway
      # of the network below; it names the client in X-Forwarded-For.
      REMOTEHUB_TRUSTED_PROXIES: ${REMOTEHUB_GATEWAY:-10.213.213.1}
    secrets: [db_password, master_key, ssh_ca_key, ldap_bind_password]
    volumes:
      - ./certs:/run/certs:ro
    ports:
      - "127.0.0.1:${REMOTEHUB_PORT:-8080}:8080"
    networks: [default, database]
    depends_on:
      db:
        condition: service_healthy
      guacd:
        condition: service_started
      browser:
        condition: service_started
      kratos:
        condition: service_started

  db:
    restart: unless-stopped
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: remotehub
      POSTGRES_USER: remotehub
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      # Since PostgreSQL 18, PGDATA lives in a versioned directory below /var/lib/postgresql.
      - db:/var/lib/postgresql
    # Only remotehub reaches the database; it has no way out.
    networks: [database]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "remotehub", "-d", "remotehub"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Ory Kratos for local accounts (kratos/, ADR 0010), with its own
  # database on the same server. People reach it only through remotehub
  # (/api/auth/); its admin API serves anyone who reaches port 4434, so it is
  # never published. Database and secrets come from secrets/kratos.yml.
  kratos-db:
    image: postgres:18.6-trixie
    command: >
      sh -c 'PGPASSWORD="$$(cat /run/secrets/db_password)"
      createdb -h db -U remotehub kratos 2>/dev/null || true'
    secrets: [db_password]
    networks: [database]
    depends_on:
      db:
        condition: service_healthy

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    command: -c /etc/config/kratos/kratos.yml -c /run/secrets/kratos.yml migrate sql up -e --yes
    environment: &kratos-env
      SQA_OPT_OUT: "true"
      SERVE_PUBLIC_BASE_URL: ${REMOTEHUB_PUBLIC_URL}/api/auth/
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${REMOTEHUB_PUBLIC_URL}/
      SELFSERVICE_ALLOWED_RETURN_URLS: '["${REMOTEHUB_PUBLIC_URL}/"]'
      SELFSERVICE_FLOWS_ERROR_UI_URL: ${REMOTEHUB_PUBLIC_URL}/sign-in
      SELFSERVICE_FLOWS_LOGIN_UI_URL: ${REMOTEHUB_PUBLIC_URL}/sign-in
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: ${REMOTEHUB_PUBLIC_URL}/sign-in
      SELFSERVICE_METHODS_WEBAUTHN_CONFIG_RP_ID: ${REMOTEHUB_HOST:?set REMOTEHUB_HOST in .env}
      SELFSERVICE_METHODS_WEBAUTHN_CONFIG_RP_ORIGINS: '["${REMOTEHUB_PUBLIC_URL}"]'
      SELFSERVICE_METHODS_PASSKEY_CONFIG_RP_ID: ${REMOTEHUB_HOST}
      SELFSERVICE_METHODS_PASSKEY_CONFIG_RP_ORIGINS: '["${REMOTEHUB_PUBLIC_URL}"]'
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: ${REMOTEHUB_PUBLIC_URL}/account
      SELFSERVICE_FLOWS_RECOVERY_UI_URL: ${REMOTEHUB_PUBLIC_URL}/sign-in/recovery
      SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: ${REMOTEHUB_PUBLIC_URL}/sign-in
    volumes:
      - ./kratos:/etc/config/kratos:ro
    # Kratos tells a configuration's format by its file name.
    secrets: &kratos-secret
      - source: kratos
        target: kratos.yml
    networks: [database]
    depends_on:
      kratos-db:
        condition: service_completed_successfully

  kratos:
    <<: *hardened
    image: oryd/kratos:v26.2.0
    # The courier sends the codes of a forgotten password; it needs the SMTP
    # server in secrets/kratos.yml (docs/install.md#local-accounts).
    command: serve -c /etc/config/kratos/kratos.yml -c /run/secrets/kratos.yml --watch-courier
    environment: *kratos-env
    tmpfs:
      - /tmp
    volumes:
      - ./kratos:/etc/config/kratos:ro
    secrets: *kratos-secret
    networks: [default, database]
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    mem_limit: 512m

  # RDP and VNC (deploy/guacd). guacd serves anyone who reaches port 4822, so
  # it is never published; it needs a way out to the devices.
  guacd:
    <<: *hardened
    image: ${GUACD_IMAGE:-ghcr.io/hilman2/remotehub-guacd}:${REMOTEHUB_VERSION:?set REMOTEHUB_VERSION in .env}
    tmpfs:
      - /tmp
      - /home/guacd:uid=1000,mode=0700
    mem_limit: 1g
    pids_limit: 256

  # Web interfaces of HTTPS devices (deploy/browser, ADR 0007): a Chromium per
  # session. Like guacd, it serves anyone who reaches port 4823, so it is never
  # published; it needs a way out to the devices.
  browser:
    <<: *hardened
    image: ${BROWSER_IMAGE:-ghcr.io/hilman2/remotehub-browser}:${REMOTEHUB_VERSION:?set REMOTEHUB_VERSION in .env}
    # Chromium's sandbox needs user namespaces, which Docker's default
    # seccomp profile forbids.
    security_opt: [no-new-privileges:true, seccomp:unconfined]
    tmpfs:
      - /tmp
    environment:
      REMOTEHUB_BROWSER_SESSIONS: ${REMOTEHUB_BROWSER_SESSIONS:-8}
    mem_limit: ${REMOTEHUB_BROWSER_MEMORY:-3g}
    pids_limit: 2048

networks:
  # A fixed range, so the gateway that remotehub trusts stays the same.
  # guacd and the browser service cannot reach devices in this range: change
  # both in .env if your network uses it.
  default:
    ipam:
      config:
        - subnet: ${REMOTEHUB_SUBNET:-10.213.213.0/24}
          gateway: ${REMOTEHUB_GATEWAY:-10.213.213.1}
  database:
    internal: true

volumes:
  db:

# Files made by init.sh; see docs/install.md#secrets.
secrets:
  db_password:
    file: ./secrets/db_password
  master_key:
    file: ./secrets/master_key
  ssh_ca_key:
    file: ./secrets/ssh_ca_key
  ldap_bind_password:
    file: ./secrets/ldap_bind_password
  kratos:
    file: ./secrets/kratos.yml
