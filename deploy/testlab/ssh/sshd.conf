# Test lab: every authentication method remotehub supports.
PasswordAuthentication yes
KbdInteractiveAuthentication yes
PubkeyAuthentication yes
PermitRootLogin no
AllowUsers tester alice
TrustedUserCAKeys /etc/ssh/remotehub-testlab-user-ca.pub
# Tests fail to sign in on purpose, all from one address. OpenSSH 9.8 would
# then refuse that address for a while, and the other tests with it (#75).
PerSourcePenalties no
