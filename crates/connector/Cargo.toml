[package]
name = "remotehub-connector"
description = "remotehub site connector: carries TCP from a network remotehub cannot reach"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# The connector runs at customer sites, also on Windows (#166). Of the other
# remotehub crates it uses only the small ones without native code (i18n,
# totp), so it builds without the server's database, vault and engines.
[[bin]]
name = "remotehub-connector"
path = "src/main.rs"

[dependencies]
remotehub-i18n.workspace = true
remotehub-totp.workspace = true

anyhow.workspace = true
argon2.workspace = true
axum = { workspace = true, features = ["form"] }
clap.workspace = true
data-encoding.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, features = ["server", "service"] }
rcgen.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pki-types.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["serde-well-known", "macros"] }
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
